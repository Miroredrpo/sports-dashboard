{% extends "base.html" %}

{% block title %}Graphs{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="text-center mb-5 animated-fade-in">
        <h1 class="display-4">Data Graphs</h1>
        <p class="lead">Visualize the competition data.</p>
    </div>

    <div class="row justify-content-center animated-fade-in">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body">
                    <div class="mb-3">
                        <label for="sport-filter" class="form-label">Filter by Sport:</label>
                        <select id="sport-filter" class="form-select">
                            <option value="all" selected>All Sports</option>
                            {% for sport in sports %}
                            <option value="{{ sport.id }}">{{ sport.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="event-selector" class="form-label">Select an Event:</label>
                        <select id="event-selector" class="form-select">
                            <option selected>Select an event...</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row justify-content-center mt-4">
        <div class="col-md-8">
            <div class="card animated-fade-in">
                <div class="card-body">
                    <div id="sport-description" class="mt-3"></div>
                    <div style="position: relative; height: 400px;">
                        <canvas id="byEventChart" class="mt-3"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const sportFilter = document.getElementById('sport-filter');
    const eventSelector = document.getElementById('event-selector');
    const descriptionDiv = document.getElementById('sport-description');
    let byEventChart;

    const allEvents = {{ games|tojson }};

    function populateEvents(sportId) {
        eventSelector.innerHTML = '<option selected>Select an event...</option>';
        const filteredEvents = sportId === 'all' ? allEvents : allEvents.filter(e => e.sport_id == sportId);

        filteredEvents.forEach(event => {
            const option = document.createElement('option');
            option.value = event.id;
            option.textContent = event.title;
            option.dataset.description = event.sport.description;
            eventSelector.appendChild(option);
        });
    }

    sportFilter.addEventListener('change', function() {
        populateEvents(this.value);
        if (byEventChart) byEventChart.destroy();
        descriptionDiv.textContent = '';
    });

    eventSelector.addEventListener('change', async function() {
        const selectedOption = this.options[this.selectedIndex];
        const eventId = this.value;
        const description = selectedOption.dataset.description;

        if (!eventId) {
            descriptionDiv.textContent = '';
            if (byEventChart) byEventChart.destroy();
            return;
        }

        descriptionDiv.textContent = description || 'No description available.';

        const response = await fetch(`/api/graphs/by_event?event_id=${eventId}`);
        const data = await response.json();

        const labels = data.breakdown.map(item => item.house);
        const points = data.breakdown.map(item => item.points);

        if (byEventChart) {
            byEventChart.destroy();
        }

        const byEventCtx = document.getElementById('byEventChart').getContext('2d');
        const gradient = byEventCtx.createLinearGradient(0, 0, 0, 400);
        gradient.addColorStop(0, 'rgba(106, 17, 203, 0.8)');
        gradient.addColorStop(1, 'rgba(37, 117, 252, 0.8)');

        byEventChart = new Chart(byEventCtx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Points in this Event',
                    data: points,
                    backgroundColor: gradient,
                    borderColor: 'rgba(106, 17, 203, 1)',
                    borderWidth: 1,
                    borderRadius: 5,
                    hoverBackgroundColor: 'rgba(37, 117, 252, 1)'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: {
                    duration: 1000,
                    easing: 'easeInOutQuad'
                },
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        enabled: true
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    });

    // Initial load
    populateEvents('all');
});
</script>
{% endblock %}
