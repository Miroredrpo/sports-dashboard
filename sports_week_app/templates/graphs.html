{% extends "base.html" %}

{% block title %}Graphs{% endblock %}

{% block content %}
<h1 class="mt-5">Data Graphs</h1>

<div class="mt-4">
    <h3>Points by Game</h3>
    <select id="game-selector" class="form-select">
        <option selected>Select a game...</option>
        {% for game in games %}
        <option value="{{ game.id }}" data-description="{{ game.sport.description }}">{{ game.title }}</option>
        {% endfor %}
    </select>
    <canvas id="byGameChart" class="mt-3"></canvas>
    <div id="sport-description" class="mt-3"></div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async function() {
    // By Game Chart
    const gameSelector = document.getElementById('game-selector');
    const descriptionDiv = document.getElementById('sport-description');
    let byGameChart;

    gameSelector.addEventListener('change', async function() {
        const selectedOption = this.options[this.selectedIndex];
        const eventId = this.value;
        const description = selectedOption.dataset.description;

        if (!eventId) {
            descriptionDiv.textContent = '';
            return;
        }

        descriptionDiv.textContent = description || 'No description available.';

        const response = await fetch(`/api/graphs/by_event?event_id=${eventId}`);
        const data = await response.json();

        const labels = data.breakdown.map(item => item.house);
        const points = data.breakdown.map(item => item.points);

        if (byGameChart) {
            byGameChart.destroy();
        }

        const byGameCtx = document.getElementById('byGameChart').getContext('2d');
        byGameChart = new Chart(byGameCtx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Points in this Game',
                    data: points,
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    });
});
</script>
{% endblock %}
