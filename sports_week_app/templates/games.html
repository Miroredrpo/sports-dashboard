{% extends "base.html" %}

{% block title %}Manage Games{% endblock %}

{% block content %}
<h1 class="mt-5">Manage Games</h1>
<p>Select a game to manage its scores.</p>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Title</th>
            <th>Venue</th>
            <th>Start Time</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for game in games %}
        <tr>
            <td>{{ game.title }}</td>
            <td>{{ game.venue }}</td>
            <td>{{ game.start_time }}</td>
            <td>
                <a href="{{ url_for('manage_game_scores', game_id=game.id) }}" class="btn btn-sm btn-primary">Manage Scores</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
