{% extends "base.html" %}

{% block title %}Leaderboard{% endblock %}

{% block head %}
<style>
    .leaderboard-item {
        display: flex;
        align-items: center;
        padding: 1rem;
        border-bottom: 1px solid var(--border-color);
        transition: background-color 0.2s ease;
    }
    .leaderboard-item:last-child {
        border-bottom: none;
    }
    .leaderboard-item:hover {
        background-color: rgba(255, 255, 255, 0.03);
    }
    .rank {
        font-size: 1.5rem;
        font-weight: var(--font-weight-black);
        width: 50px;
        text-align: center;
    }
    .house-color {
        width: 10px;
        height: 40px;
        margin-right: 1rem;
        border-radius: 5px;
    }
    .house-name {
        flex-grow: 1;
        font-size: 1.2rem;
    }
    .points {
        font-size: 1.5rem;
        font-weight: var(--font-weight-bold);
    }
</style>
{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="neumorphic-card">
        <h1 class="mb-4 text-center">Leaderboard</h1>
        <div class="d-flex justify-content-center mb-4">
            <select id="sport-filter" class="form-select form-control" style="max-width: 300px;">
                <option value="all">All Sports</option>
                {% for sport in sports %}
                    <option value="{{ sport.id }}">{{ sport.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div id="leaderboard-content">
            <!-- Leaderboard items will be injected here by JavaScript -->
        </div>
         <p class="text-center text-muted mt-4">
            Note: Points are cumulative. For final results, please visit the <a href="{{ url_for('winners') }}">Winners Page</a>.
        </p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const filter = document.getElementById('sport-filter');
        const content = document.getElementById('leaderboard-content');

        function fetchLeaderboard(sportId = 'all') {
            content.innerHTML = '<div class="text-center p-5">Loading...</div>';
            fetch(`/api/leaderboard?sport_id=${sportId}`)
                .then(response => response.json())
                .then(data => {
                    content.innerHTML = '';
                    if (data.length === 0) {
                        content.innerHTML = '<div class="text-center p-5">No data available.</div>';
                        return;
                    }
                    data.forEach((item, index) => {
                        const rank = index + 1;
                        const houseColor = item.color || '#333';
                        const leaderboardItem = `
                            <div class="leaderboard-item">
                                <div class="rank">#${rank}</div>
                                <div class="house-color" style="background-color: ${houseColor};"></div>
                                <div class="house-name">${item.name}</div>
                                <div class="points">${item.points} pts</div>
                            </div>
                        `;
                        content.insertAdjacentHTML('beforeend', leaderboardItem);
                    });
                });
        }

        filter.addEventListener('change', () => {
            fetchLeaderboard(filter.value);
        });

        // Initial load
        fetchLeaderboard();
    });
</script>
{% endblock %}
