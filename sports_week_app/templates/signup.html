{% extends "base.html" %}

{% block title %}Sign Up{% endblock %}

{% block head %}
<style>
    html, body { height: 100%; }
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding-top: 0; /* Override base padding */
    }
    .split-container {
        display: flex;
        width: 100%;
        height: 100%;
    }
    .split-image {
        flex: 1;
        background: url('https://images.unsplash.com/photo-1541252260730-0412e8e2108e?q=80&w=1974&auto=format&fit=crop') no-repeat center center;
        background-size: cover;
    }
    .split-form {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
    }
    .form-container {
        width: 100%;
        max-width: 400px;
    }
    .form-control {
        background-color: var(--background-color) !important;
        color: var(--text-color) !important;
        border: 1px solid var(--border-color) !important;
    }
</style>
{% endblock %}

{% block content %}
<div class="split-container">
    <div class="split-image"></div>
    <div class="split-form">
        <div class="form-container neumorphic-card">
            <h2 class="text-center mb-4">Create Account</h2>
            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
            <form method="POST">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn neumorphic-btn w-100">Sign Up</button>
            </form>
             <p class="mt-3 text-center">
                Already have an account? <a href="{{ url_for('login') }}">Login</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
