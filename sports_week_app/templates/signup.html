{% extends "base.html" %}

{% block title %}Sign Up{% endblock %}

{% block content %}
<style>
    .signup-wrapper {
        display: grid;
        grid-template-columns: 1fr 1fr;
        min-height: 100vh;
    }

    .signup-image {
        background-image: url('https://images.unsplash.com/photo-1593341646782-e0185ad2ff7f?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80');
        background-size: cover;
        background-position: center;
    }

    .signup-form-container {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px;
    }

    .signup-card {
        max-width: 450px;
        width: 100%;
    }

    @media (max-width: 992px) {
        .signup-wrapper {
            grid-template-columns: 1fr;
        }
        .signup-image {
            display: none;
        }
    }
</style>

<div class="signup-wrapper">
    <div class="signup-image"></div>
    <div class="signup-form-container">
        <div class="signup-card animated-fade-in">
            <h1 class="text-center mb-4">Create Your Account</h1>
            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
            <form action="{{ url_for('signup') }}" method="POST">
                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" name="email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" name="password" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Sign Up</button>
                </div>
            </form>
            <p class="mt-3 text-center">
                Already have an account? <a href="{{ url_for('login') }}">Log in here</a>.
            </p>
        </div>
    </div>
</div>
{% endblock %}
