<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sports Week App{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='custom.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='neumorphic.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-expand-lg fixed-top glassmorphic-nav">
        <div class="container-fluid">
        <a class="navbar-brand" href="{{ url_for('dashboard') }}">
            <!-- Placeholder for Logo -->
            <img src="https://via.placeholder.com/120x40.png?text=LOGO" alt="Logo" style="height: 40px;">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
            <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto d-flex flex-row align-items-center">
                <!-- Notification Bell -->
                <li class="nav-item me-3">
                    <a class="nav-link" href="#">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-bell"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                        <span class="notification-dot"></span>
                    </a>
                </li>
                <!-- Theme Switch -->
                <li class="nav-item me-3">
                    <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="theme-switch">
                        <label class="form-check-label" for="theme-switch">
                            <!-- Sun/Moon Icon would go here -->
                        </label>
                        </div>
                </li>
                <!-- User Avatar/Links -->
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('winners') }}">Winners</a>
                    </li>
                    {% if session['user'] %}
                        {% if session['is_admin'] %}
                        <li class="nav-item me-2">
                                <a class="nav-link" href="{{ url_for('admin_dashboard') }}">Admin</a>
                            </li>
                        {% endif %}
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
                        </li>
                    {% else %}
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('login') }}">Login</a>
                        </li>
                    {% endif %}
                <li class="nav-item ms-3">
                    <!-- Placeholder for User Avatar -->
                    <img src="https://via.placeholder.com/40x40.png?text=User" alt="User Avatar" class="rounded-circle" style="height: 40px; width: 40px;">
                </li>
                </ul>
            </div>
        </div>
    </nav>
    {% include 'includes/loader.html' %}
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const loader = document.getElementById('loader');

        // Show loader on form submission
        document.querySelectorAll('form').forEach(form => {
            form.addEventListener('submit', () => {
                loader.style.display = 'block';
            });
        });

        // Show loader on link clicks that navigate
        document.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', (e) => {
                if (link.href && link.target !== '_blank') {
                    loader.style.display = 'block';
                }
            });
        });

        window.addEventListener('pageshow', () => {
            loader.style.display = 'none';
        });

        document.addEventListener('DOMContentLoaded', function() {
            const themeSwitch = document.getElementById('theme-switch');
            themeSwitch.addEventListener('change', function() {
                document.body.classList.toggle('dark-mode');
                if (document.body.classList.contains('dark-mode')) {
                    localStorage.setItem('theme', 'dark');
                } else {
                    localStorage.setItem('theme', 'light');
                }
            });

            // Apply saved theme
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
                themeSwitch.checked = true;
            }
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
